<h1>Agregar Tipos de gastos</h1>
<div class="form-container">
  <form [formGroup]="tipoGastoForm">

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput name="nombre" formControlName="nombre" required [(ngModel)]="editingTipo.nombre">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <input matInput name="nombre" formControlName="descripcion" [(ngModel)]="editingTipo.descripcion">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="guardar()">
      Guardar
    </button>

  </form>
</div>

<h1>Tipos de gastos</h1>
<div class="table-container">
  <table mat-table [dataSource]="tiposGasto" class="mat-elevation-z2 full-width">

    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let row">{{ row.codigo }}</td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripcion</th>
      <td mat-cell *matCellDef="let row">{{ row.descripcion }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">

        <button mat-icon-button color="primary">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="eliminar(row.id)">
          <mat-icon>delete</mat-icon>
        </button>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['codigo','nombre','descripcion','acciones']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['codigo','nombre','descripcion','acciones'];"></tr>

  </table>
</div>
